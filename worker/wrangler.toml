name = "project-brain-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Workers AI binding (env.AI)
[ai]
binding = "AI"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "project-brain-db"
database_id = "b3c35b1e-21f9-47a5-9a87-03a9485b80ba"

[vars]
# Browser origins allowed to call the Worker (comma-separated). Add your hosted app's URL later.
ALLOWED_ORIGINS = "http://localhost:5173,https://project-brain-557.pages.dev,https://ashfad-updates.project-brain-557.pages.dev"
# Model used when the app doesn't ask for one, and the only models it may ask for.
DEFAULT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
ALLOWED_MODELS = "@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/meta/llama-3.1-8b-instruct-fast"
# Largest request body accepted, in bytes.
MAX_BODY_BYTES = "200000"
# Largest workspace push to /v1/sync, in bytes. (Each project must also fit in one 2 MB D1 row.)
MAX_SYNC_BYTES = "8000000"
# Largest attachment upload when an R2 bucket is bound as BUCKET; without R2, files go to D1 (max ~1.9 MB).
MAX_BLOB_BYTES = "25000000"

# The shared token is a secret, not a var:  npx wrangler secret put APP_TOKEN
